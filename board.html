<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Bảng đen — Sam Teaching Visual</title>
  <link rel="stylesheet" href="/board.css">
  <script type="module" src="/src/board.mjs"></script>
</head>
<body>
  <canvas id="boardCanvas"></canvas>

  <p id="boardHint">Kéo chuột hoặc bút để viết • Bấm ☰ góc phải dưới hoặc phím H để hiện lại • F: toàn màn hình • Ctrl+Z: hoàn tác</p>

  <nav id="notebookBar" class="notebook-bar ui-hidden" aria-label="Quản lý sổ ghi chép">
    <button type="button" id="notebookBtn" class="notebook-btn" aria-label="Quản lý sổ ghi chép" title="Quản lý sổ ghi chép">
      <span class="notebook-icon" aria-hidden="true">📓</span>
      <span id="notebookName" class="notebook-name">SamNguyen 1</span>
    </button>
    <div id="syncStatus" class="sync-status" data-trang-thai="dang" role="status" aria-live="polite" title="Đang đồng bộ…">
      <span class="sync-dot" aria-hidden="true"></span>
      <span class="sync-text"><span class="sync-text-full">Đang đồng bộ…</span><span class="sync-text-short">Đang đồng bộ</span></span>
    </div>
  </nav>

  <nav id="pageBar" class="page-bar" aria-label="Điều khiển trang bảng">
    <button type="button" id="prevPageBtn" class="page-btn" aria-label="Trang trước" title="Trang trước ([ hoặc PageUp])">‹</button>
    <span id="pageLabel" class="page-label">Trang 1/1</span>
    <button type="button" id="nextPageBtn" class="page-btn" aria-label="Trang sau" title="Trang sau (] hoặc PageDown)">›</button>
    <button type="button" id="addPageBtn" class="page-btn add-btn" aria-label="Thêm trang mới" title="Thêm trang mới (N)">+</button>
    <button type="button" id="pagesBtn" class="page-btn pages-btn" aria-label="Xem lại các trang" title="Xem lại các trang">Các trang</button>
  </nav>

  <div id="boardToolbar" role="toolbar" aria-label="Thanh công cụ bảng đen">
    <button type="button" id="notebookToggleBtn" class="tool-btn notebook-toggle-btn" aria-label="Hiện hoặc ẩn tên sổ và trạng thái đồng bộ" aria-pressed="false" title="Hiện tên sổ và trạng thái đồng bộ">📓</button>
    <button type="button" id="penBtn" class="tool-btn active" aria-label="Bút viết" title="Bút (P)">Bút</button>
    <button type="button" id="eraserBtn" class="tool-btn" aria-label="Tẩy xóa" title="Tẩy (E)">Tẩy</button>

    <div id="colorSwatches" class="swatches" aria-label="Bảng màu nét vẽ">
      <button type="button" class="swatch active" data-color="#ffffff" style="--swatch-color:#ffffff" aria-label="Màu trắng" title="Trắng"></button>
      <button type="button" class="swatch" data-color="#ffd43b" style="--swatch-color:#ffd43b" aria-label="Màu vàng" title="Vàng"></button>
      <button type="button" class="swatch" data-color="#4dd4ff" style="--swatch-color:#4dd4ff" aria-label="Màu xanh" title="Xanh"></button>
      <button type="button" class="swatch" data-color="#ff6b6b" style="--swatch-color:#ff6b6b" aria-label="Màu đỏ" title="Đỏ"></button>
      <button type="button" class="swatch" data-color="#69db7c" style="--swatch-color:#69db7c" aria-label="Màu lục" title="Lục"></button>
      <button type="button" class="swatch" data-color="#c084fc" style="--swatch-color:#c084fc" aria-label="Màu tím" title="Tím"></button>
    </div>

    <label class="width-label" for="widthRange" title="Độ dày nét">
      <span class="sr-only">Độ dày nét</span>
      <input type="range" id="widthRange" min="2" max="40" value="6" aria-label="Độ dày nét">
    </label>

    <button type="button" id="undoBtn" class="action-btn" aria-label="Hoàn tác nét vẽ" title="Hoàn tác (Ctrl+Z)">Hoàn tác</button>
    <button type="button" id="clearBtn" class="action-btn" aria-label="Xoá toàn bộ bảng" title="Xoá bảng">Xoá bảng</button>
    <button type="button" id="saveImageBtn" class="action-btn" aria-label="Lưu ảnh bảng dưới dạng PNG" title="Lưu ảnh PNG">Lưu ảnh PNG</button>
    <button type="button" id="saveDriveBtn" class="action-btn" aria-label="Lưu toàn bộ các trang lên Google Drive" title="Lưu tất cả lên Drive">Lưu tất cả lên Drive</button>
    <button type="button" id="copyDriveLinkBtn" class="action-btn" aria-label="Sao chép link thư mục Drive" title="Lưu lên Drive trước đã" disabled>Sao chép link</button>
    <button type="button" id="syncNowBtn" class="action-btn" aria-label="Đồng bộ dữ liệu sổ tay với máy chủ" title="Đồng bộ với máy chủ ngay">Đồng bộ</button>
    <button type="button" id="fullscreenBtn" class="action-btn" aria-label="Toàn màn hình" title="Toàn màn hình (F)">Toàn màn hình</button>
    <button type="button" id="hideUiBtn" class="action-btn" aria-label="Ẩn thanh công cụ" title="Ẩn thanh công cụ (H)">Ẩn thanh công cụ</button>

    <a href="/studio" class="studio-link" title="Chuyển sang Studio ghi hình">Studio</a>
    <button type="button" id="logoutBtn" class="action-btn logout-btn" aria-label="Đăng xuất" title="Đăng xuất">Đăng xuất</button>
  </div>

  <button type="button" id="boardRestoreBtn" class="restore-btn ui-hidden" aria-label="Hiện lại thanh công cụ" title="Hiện thanh công cụ (H)">
    <span class="restore-icon" aria-hidden="true">☰</span>
    <span class="restore-text">Hiện thanh công cụ</span>
  </button>

  <div id="pageOverview" class="page-overview ui-hidden" role="dialog" aria-modal="true" aria-label="Xem lại các trang bảng">
    <div class="overview-header">
      <h2 class="overview-title">Danh sách các trang bảng</h2>
      <button type="button" id="closeOverviewBtn" class="overview-close-btn" aria-label="Đóng danh sách trang">Đóng (Esc)</button>
    </div>
    <div id="overviewGrid" class="overview-grid"></div>
  </div>

  <div id="notebookManager" class="page-overview ui-hidden" role="dialog" aria-modal="true" aria-label="Quản lý sổ ghi chép">
    <div class="overview-header">
      <h2 class="overview-title">Sổ ghi chép</h2>
      <div class="overview-actions">
        <button type="button" id="addNotebookBtn" class="overview-add-btn" aria-label="Thêm sổ mới">+ Sổ mới</button>
        <button type="button" id="closeNotebookBtn" class="overview-close-btn" aria-label="Đóng quản lý sổ">Đóng (Esc)</button>
      </div>
    </div>
    <div id="notebookList" class="notebook-list"></div>
  </div>
  <div id="boardToast" class="board-toast ui-hidden" role="status" aria-live="polite">
    <div id="toastMessage" class="toast-message"></div>
    <div id="toastActions" class="toast-actions"></div>
    <button type="button" id="toastCloseBtn" class="toast-close-btn" aria-label="Đóng thông báo">×</button>
  </div>
</body>
</html>
